<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ActionPicker</title>
<style>
  :root { --bg:#0e0f12; --card:#17191e; --line:#262a32; --ink:#e8e6e1; --mute:#8b909a; --accent:#d9442b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:28px 16px 80px; }
  h1 { font-size:28px; letter-spacing:.02em; margin:0 0 4px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--mute); font-size:14px; margin-bottom:20px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  button.chip { background:var(--card); color:var(--ink); border:1px solid var(--line); padding:8px 14px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; }
  button.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .top { display:flex; gap:14px; align-items:baseline; }
  .rank { color:var(--mute); width:28px; font-variant-numeric:tabular-nums; }
  .name { font-weight:600; flex:1; }
  .val { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:700; }
  .meta { color:var(--mute); font-size:13px; margin:2px 0 0 42px; }
  details { margin:8px 0 0 42px; }
  summary { cursor:pointer; color:var(--mute); font-size:13px; }
  .bars { display:grid; grid-template-columns:110px 1fr 24px; gap:4px 8px; align-items:center; margin:10px 0; font-size:13px; }
  .track { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); }
  .ov { font-size:14px; color:#c9c6bf; margin:8px 0; }
  ul.ev { margin:6px 0 0; padding-left:18px; font-size:13px; color:#c9c6bf; }
  ul.ev a { color:var(--mute); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Action<span>Picker</span></h1>
  <div class="sub" id="sub">loading...</div>
  <div class="bar" id="modes"></div>
  <div class="bar" id="kinds"></div>
  <div id="list"></div>
</main>
<script>
const STYLE = { hand_to_hand: "hand-to-hand", swordplay: "swordplay", gun_fu: "gun-fu", mixed: "mixed" };
const state = { mode: "action", kind: "all", data: null };

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function chips(el, items, key) {
  el.innerHTML = "";
  for (const [value, label] of items) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", String(state[key] === value));
    b.onclick = () => { state[key] = value; render(); };
    el.appendChild(b);
  }
}

function bar(label, v) {
  return `<span>${label}</span><div class="track"><div class="fill" style="width:${v * 10}%"></div></div><span>${v}</span>`;
}

function render() {
  chips(document.getElementById("modes"), [["action", "Action"], ["crime", "Crime"]], "mode");
  chips(document.getElementById("kinds"), [["all", "All"], ["movie", "Movies"], ["series", "Series"]], "kind");
  const rows = (state.data[state.mode] || []).filter(r => state.kind === "all" || r.kind === state.kind);
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<div class="empty">Nothing scored here yet.</div>'; return; }
  list.innerHTML = rows.map((r, i) => {
    const season = r.season ? ` · Season ${r.season}` : "";
    const ev = (r.evidence || []).map(e => `<li>${esc(e.text)} <a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">source</a></li>`).join("");
    return `<div class="item">
      <div class="top"><span class="rank">${i + 1}</span><span class="name">${esc(r.name)}${season}</span><span class="val">${r.value.toFixed(2)}</span></div>
      <div class="meta">${r.year || "?"} · ${r.kind} · ${STYLE[r.style] || esc(r.style)} · TMDB ${r.tmdb_rating ?? "?"}</div>
      <details><summary>why</summary>
        <div class="bars">${bar("Fight quality", r.fight_quality)}${bar("Action density", r.action_density)}${bar("Grit", r.grit)}${bar("Pacing", r.pacing)}${bar("Crime tone", r.crime_tone)}</div>
        <div class="ov">${esc(r.overview)}</div>
        <ul class="ev">${ev}</ul>
      </details></div>`;
  }).join("");
}

fetch("data.json").then(r => r.json()).then(d => {
  state.data = d;
  document.getElementById("sub").textContent = "Ranked from TMDB data and written reviews. Updated " + d.generated.slice(0, 10) + ".";
  render();
}).catch(() => { document.getElementById("sub").textContent = "Could not load data.json"; });
</script>
</body>
</html>
